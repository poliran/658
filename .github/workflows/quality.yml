name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Linting (Flake8 & Black)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run Black (code formatting check)
        run: black --check src/ tests/ --line-length=120
        continue-on-error: true

      - name: Run isort (import sorting check)
        run: isort --check-only src/ tests/
        continue-on-error: true

      - name: Run Flake8 (linting)
        run: |
          flake8 src/ tests/ \
            --max-line-length=120 \
            --count \
            --statistics \
            --show-source
        continue-on-error: true

  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install type checker
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-pyyaml

      - name: Run mypy type check
        run: mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  security:
    name: Security Scanning (Bandit)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install security scanner
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit security scan
        run: |
          bandit -r src/ -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --desc
        continue-on-error: true

  code-metrics:
    name: Code Metrics & Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pylint & radon
        run: |
          python -m pip install --upgrade pip
          pip install pylint radon

      - name: Check code complexity
        run: |
          radon cc src/ -a
          radon mi src/ -na
        continue-on-error: true

      - name: Run Pylint
        run: pylint src/ --exit-zero --output-format=text
        continue-on-error: true

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, dependencies, code-metrics]
    if: always()
    
    steps:
      - name: Quality Check Status
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Type Check: ${{ needs.type-check.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "Dependencies: ${{ needs.dependencies.result }}"
          echo "Metrics: ${{ needs.code-metrics.result }}"
          echo ""
          echo "Quality checks completed (non-blocking)"
