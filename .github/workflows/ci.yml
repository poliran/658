name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint Code with Flake8
        run: |
          flake8 src/ tests/ --max-line-length=100

      - name: Check Formatting with Black
        run: |
          black --check src/ tests/ --line-length=100

      - name: Run Unit Tests & Coverage
        run: |
          python -m pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing

      - name: Test CLI Commands
        run: |
          python cli.py predict
          python cli.py optimize
          python cli.py report
          python cli.py evaluate

  docker-build:
    name: Build & Verify Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t lottery-predictor:ci .

      - name: Run Container Health Check & Prediction
        run: |
          docker run --rm lottery-predictor:ci python cli.py predict
          docker run --rm lottery-predictor:ci python cli.py report
