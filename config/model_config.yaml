lottery:
  min_number: 1
  max_number: 58
  numbers_per_draw: 6

data:
  validation:
    required_columns:
      - LOTTO GAME
      - COMBINATIONS
      - DRAW DATE

models:
  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6
    early_stopping_rounds: 10

  random_forest:
    n_estimators: 100
    max_depth: 10

  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 6

prediction:
  strategy: "unique" # or "unique, top_k"
  confidence_threshold: 0.7
