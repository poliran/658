services:
  lottery-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lottery-predictor
    image: lottery-predictor:latest

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./cli.py:/app/cli.py
      - ./outputs:/app/outputs

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    restart: no

  lottery-predictor-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lottery-predictor-dev
    image: lottery-predictor:latest

    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./cli.py:/app/cli.py
      - ./tests:/app/tests
      - ./outputs:/app/outputs
      - ./requirements-dev.txt:/app/requirements-dev.txt

    command: >
      bash -c "pip install -r requirements-dev.txt &&
               python -m pytest tests/ -v --cov=src --cov-report=html"

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    restart: no
