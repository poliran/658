# Pre-commit hooks for lottery prediction system
# Install: pip install pre-commit
# Setup:  pre-commit install
# Run:    pre-commit run --all-files

repos:
  # Git hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML syntax
        args: ['--unsafe']
      - id: check-json
        name: Check JSON syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: debug-statements
        name: Check for debug statements
      - id: mixed-line-ending
        name: Fix mixed line endings
      - id: check-case-conflict
        name: Check for case conflicts
      - id: check-docstring-first
        name: Check docstring first

  # Python code formatting with Black
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        name: Black code formatter
        language_version: python3.12
        args: ['--line-length=120']

  # Import sorting with isort
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort import sorting
        args: ['--profile=black', '--line-length=120']

  # Linting with Flake8
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        name: Flake8 linting
        args: ['--max-line-length=120', '--extend-ignore=E203,W503']
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: mypy type checking
        language_version: python3.12
        args: ['--ignore-missing-imports', '--no-error-summary']
        additional_dependencies:
          - types-pyyaml

  # Security with Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        name: Bandit security check
        args: ['-ll']  # Low severity and above
        exclude: tests/

  # YAML formatting and linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: yamllint YAML linting
        args: ['--config-data={rules: {line-length: {max: 120}}}']

  # Docker linting
  - repo: https://github.com/hadialqattan/Dockerfilelint
    rev: v0.1.32
    hooks:
      - id: dockerfilelint
        name: Docker linting

  # Markdown linting
  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.12.0
    hooks:
      - id: markdownlint
        name: Markdown linting
        exclude: node_modules/

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        name: Spell check
        exclude: (htmlcov|coverage\.xml)

# Configuration
default_language_version:
  python: python3.12

exclude: |
  (?x)^(
    htmlcov/|
    \.pytest_cache/|
    \.mypy_cache/|
    __pycache__/|
    \.venv/|
    venv/|
    dist/|
    build/|
    \.eggs/
  )
